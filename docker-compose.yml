services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app
    depends_on:
      - redis
    environment:
      - TZ=America/Sao_Paulo
    networks:
      - app
    volumes:
      - .:/app

  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: >
      redis-server
      --save 900 1
      --save 300 10
      --save 60 10000
      --dir /data
      --dbfilename dump.rdb
      --appendonly yes
      --appendfsync everysec
    networks:
      - app

volumes:
  redis_data:

networks:
  app:
    driver: bridger4